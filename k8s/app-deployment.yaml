apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: space-mission
  labels:
    app: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: ai-dev-project-app:536ad414-1793047050
          # Use local image loaded via `kind load docker-image`
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: DB_HOST
              value: postgres-svc
            - name: DB_PORT
              value: "5432"
          # ---------- readiness / liveness ----------
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: app-svc
  namespace: space-mission
spec:
  selector:
    app: app
  ports:
    - port: 80
      targetPort: 8000
  type: NodePort
