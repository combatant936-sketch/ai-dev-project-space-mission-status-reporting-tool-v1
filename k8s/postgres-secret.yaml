apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: space-mission
type: Opaque
stringData:
  POSTGRES_DB:       space_mission
  POSTGRES_USER:     space_user
  POSTGRES_PASSWORD: space_pass
  DATABASE_URL: >-
    postgresql+psycopg2://space_user:space_pass@postgres-svc:5432/space_mission
